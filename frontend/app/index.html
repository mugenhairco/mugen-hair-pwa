<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <!-- Domain lama Render (*.onrender.com) -> domain produksi: lihat
       penjelasan lengkap di frontend/index.html (root Landing Page) --
       situs statis ini SATU deployment yang sama, jadi alasannya identik. -->
  <script>
    if (location.hostname === "mugenhairco.onrender.com") {
      location.replace("https://rivoirsett.com" + location.pathname + location.search + location.hash);
    }
  </script>
  <!-- HOTFIX Migrasi Subdomain: root domain (rivoirsett.com/www.rivoirsett.com,
       TANPA subdomain tenant apa pun) TIDAK BOLEH LAGI menampilkan Dashboard/
       Login/Booking siapa pun -- backend (tenant_db.cari_tenant_publik())
       sudah berhenti diam-diam jatuh ke tenant default untuk request tanpa
       slug, jadi mengakses /app/ langsung di root domain sekarang hanya akan
       menampilkan error "Tenant tidak ditemukan" di mana-mana, membingungkan
       untuk siapa pun yang masih punya link/bookmark LAMA (satu-satunya
       tenant yang PERNAH bisa diakses lewat root domain, sebelum migrasi
       subdomain ini, adalah Mugen Hair Co) -- diarahkan otomatis ke
       subdomain barunya, path/query/hash yang sama persis dipertahankan,
       pola SAMA seperti redirect onrender.com di atas. TIDAK memicu apa pun
       untuk subdomain tenant manapun (mis. mugen.rivoirsett.com sendiri,
       atau admin.rivoirsett.com) -- HANYA root/www bare.
       PENGECUALIAN #/register: root domain sekarang juga jadi tempat
       Landing Page SaaS mengarahkan tombol "Get Started" ke /app/#/register
       (lihat router.js) -- rute ini SENGAJA berjalan TANPA sesi/tenant di
       root domain, jadi TIDAK BOLEH ikut dilempar ke mugen.rivoirsett.com
       seperti bookmark lama lainnya. -->
  <script>
    if ((location.hostname === "rivoirsett.com" || location.hostname === "www.rivoirsett.com") &&
        !location.hash.startsWith("#/register")) {
      location.replace("https://mugen.rivoirsett.com" + location.pathname + location.search + location.hash);
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>Rivoir</title>
  <!-- TAHAP 10 + FONDASI Multi-Tenant Phase 2.2: judul di atas hanya
       fallback PLATFORM awal sebelum JS jalan -- brand.js akan menimpa
       document.title dengan nama barbershop tenant (kalau sudah dikenali)
       dari /api/tenant/branding begitu halaman selesai dimuat. "Rivoir"
       (BUKAN nama tenant tertentu) sengaja dipakai di sini supaya
       deployment white-label baru tidak menampilkan identitas satu
       barbershop tertentu sebelum tenant-nya sendiri diketahui. -->
  <meta name="theme-color" content="#F5F7FA" />
  <meta name="description" content="Platform manajemen barbershop -- komisi, uang harian, bonus barber, produk, dan pengeluaran." />
  <link rel="manifest" href="manifest.json" />

  <!-- TAHAP 13: set ikon lengkap (sebelumnya manifest.json/tag di bawah ini
       menunjuk ke file icons/* yang belum pernah ada di repo -- PWA jadi
       tidak bisa di-install dengan benar di banyak browser/OS). -->
  <link rel="icon" type="image/x-icon" href="../icons/favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../icons/icon-512.png" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />

  <!-- Splash screen iOS: Safari modern (15+) otomatis membuat launch screen
       dari ikon + background_color manifest begitu tag "web-app-capable" di
       bawah ini ada, tanpa perlu puluhan gambar apple-touch-startup-image
       per resolusi device. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Rivoir" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- PERBAIKAN MEKANISME CACHE & UPDATE PWA (v57): query "?v=82" di
       SETIAP <link rel="stylesheet">/<script src> di bawah ini adalah
       cache-busting di lapisan URL, INDEPENDEN dari Service Worker --
       browser/CDN mana pun yang meng-cache berdasar URL persis tidak
       punya alasan menyajikan byte lama begitu query string-nya beda.
       WAJIB dinaikkan BERSAMAAN dengan ASSET_VERSION di service-worker.js
       ke angka yang SAMA setiap deploy yang mengubah isi file JS/CSS
       manapun yang dirujuk di sini (lihat komentar ASSET_VERSION di
       service-worker.js untuk alasan kenapa dua tempat ini tidak bisa
       disatukan lewat satu file "sumber kebenaran" tanpa proses build). -->
  <link rel="stylesheet" href="css/style.css?v=82" />
</head>
<body>
  <!-- REVISI UI/UX: watermark developer -- di LUAR #app dengan sengaja,
       supaya tidak pernah ikut terhapus/tertimpa render ulang SPA (setiap
       halaman melakukan root.innerHTML = "" pada #app saja) dan tidak ada
       jalan untuk menonaktifkannya lewat menu Setting mana pun. -->
  <div class="dev-watermark-bg" aria-hidden="true">Rivoir</div>

  <div id="app">
    <p class="status-placeholder">Memuat aplikasi...</p>
  </div>

  <div class="dev-watermark-footer" aria-hidden="true">Powered by Rivoir</div>

  <!-- Ganti nilai ini ke URL backend setelah deploy, contoh:
       <script>window.MUGEN_API_BASE = "https://api.rivoirsett.com";</script>
       Dibiarkan kosong di sini supaya api.js otomatis pakai localhost:8000
       saat development, dan bisa dioverride lewat env saat build/deploy. -->
  <script src="config.js?v=82"></script>
  <!-- REVISI: preconnect sedini mungkin ke backend Render -- logo & banner
       (dan semua data lain) dimuat dari origin ini, jadi DNS/TLS handshake-nya
       bisa mulai lebih awal sebelum brand.js sempat meminta gambar apa pun,
       supaya logo/banner tersedia lebih cepat saat aplikasi pertama dibuka. -->
  <script>
    if (window.MUGEN_API_BASE) {
      const preconnect = document.createElement("link");
      preconnect.rel = "preconnect";
      preconnect.href = window.MUGEN_API_BASE;
      document.head.appendChild(preconnect);
    }
  </script>

  <!-- Preview PDF (Cetak PDF): PDF.js dimuat lewat modul terpisah SEDINI
       mungkin (fetch besar ~1.8MB berjalan di background, tidak memblokir
       skrip lain) -- lihat pdfjs_boot.js untuk kenapa harus type="module"
       dan kenapa dipakai lewat window.pdfjsLib + event 'pdfjs-ready',
       bukan import langsung di pdf_preview.js. -->
  <script type="module" src="js/pdfjs_boot.js?v=82"></script>
  <script src="js/state.js?v=82"></script>
  <!-- REVISI UI/UX: theme.js dimuat SEDINI mungkin (segera setelah
       state.js) dan langsung menerapkan atribut data-theme begitu file
       ini selesai dieksekusi (lihat applyStored() di baris terakhir
       theme.js) -- supaya tema Dark/Light yang benar sudah aktif SEBELUM
       #app sempat digambar sama sekali, menghindari "flash" tema salah. -->
  <script src="js/theme.js?v=82"></script>
  <script src="js/api.js?v=82"></script>
  <script src="js/ui.js?v=82"></script>
  <script src="js/pdf_preview.js?v=82"></script>
  <script src="js/brand.js?v=82"></script>
  <script src="js/subscription.js?v=82"></script>
  <script src="js/feature_access.js?v=82"></script>
  <script src="js/pwa_update.js?v=82"></script>
  <script src="js/nav.js?v=82"></script>
  <script src="js/booking_notif.js?v=82"></script>
  <script src="js/izin_notif.js?v=82"></script>
  <script src="js/pages/login.js?v=82"></script>
  <script src="js/pages/register.js?v=82"></script>
  <script src="js/pages/lupa_password.js?v=82"></script>
