<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <!-- FITUR Kompatibilitas URL Booking (Instagram Bio dkk): seluruh aset di
       bawah (js/..., css/..., ../icons/...) dimuat lewat path RELATIF --
       relatif terhadap URL DOKUMEN yang sedang dibuka. Selama halaman ini
       selalu diakses lewat "/app/..." (termasuk "/app/book", lihat
       render.yaml) itu otomatis benar (base implisitnya "/app/"). TAPI
       "/book" (path baru, TANPA "/app/" di depan -- lihat render.yaml routes
       & tenant_db.py::get_booking_url()) juga di-rewrite server ke index.html
       INI, dan tanpa <base> di bawah ini base implisitnya jadi "/" (root),
       membuat SEMUA aset relatif salah resolve ("js/app.js" jadi "/js/app.js"
       alih-alih "/app/js/app.js") -- <base> di sini memaksa base SELALU
       "/app/" apa pun path URL yang sebenarnya diketik, jadi kedua bentuk URL
       ("/book" maupun "/app/book") sama-sama benar. TIDAK memengaruhi
       location.hash/location.pathname/history.pushState (dipakai router.js
       untuk routing) -- <base> hanya memengaruhi resolusi URL relatif di
       href/src/fetch relatif, bukan itu. -->
  <base href="/app/" />
  <!-- Domain lama Render (*.onrender.com) -> domain produksi: lihat
       penjelasan lengkap di frontend/index.html (root Landing Page) --
       situs statis ini SATU deployment yang sama, jadi alasannya identik. -->
  <script>
    if (location.hostname === "mugenhairco.onrender.com") {
      location.replace("https://rivoirsett.com" + location.pathname + location.search + location.hash);
    }
  </script>
  <!-- REVISI KRITIS (dihapus total -- insiden produksi): HOTFIX Migrasi
       Subdomain SEBELUMNYA di sini memaksa redirect root domain
       (rivoirsett.com/www.rivoirsett.com) ke mugen.rivoirsett.com untuk
       SEMUA hash selain lima rute pre-auth (#/register, #/login, dst) --
       termasuk #/dashboard dan rute tenant-scope lain. Niat awalnya murni
       kompatibilitas bookmark LAMA pra-migrasi subdomain (satu-satunya
       tenant yang pernah bisa diakses lewat root domain dulu adalah Mugen
       Hair Co), TAPI efek sampingnya jauh lebih parah: root domain SEKARANG
       memang jalur akses NORMAL & VALID untuk SEMUA tenant (session-based,
       lihat auth.py::get_current_user()/resolve_tenant_untuk_branding() --
       KEDUANYA menentukan tenant dari TOKEN LOGIN, BUKAN dari hostname) --
       jadi SETIAP kali tenant lain (mis. Pomade, Demo Barbershop) reload
       halaman apa pun selain lima rute pre-auth itu di root domain, mereka
       dipaksa pindah ke origin mugen.rivoirsett.com -- origin BERBEDA
       dengan localStorage TERPISAH TOTAL (token/sesi mereka TIDAK ikut
       pindah), sehingga terlempar ke Login (atau, kalau browser itu
       kebetulan pernah login sebagai tenant lain di subdomain mugen,
       melihat sesi/branding tenant ITU). Backend TIDAK PERNAH butuh
       redirect ini untuk resolusi tenant yang benar -- dihapus total,
       BUKAN diperbaiki kondisinya, supaya root domain benar-benar netral
       untuk SEMUA tenant seperti seharusnya. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>Rivoir</title>
  <!-- TAHAP 10 + FONDASI Multi-Tenant Phase 2.2: judul di atas hanya
       fallback PLATFORM awal sebelum JS jalan -- brand.js akan menimpa
       document.title dengan nama barbershop tenant (kalau sudah dikenali)
       dari /api/tenant/branding begitu halaman selesai dimuat. "Rivoir"
       (BUKAN nama tenant tertentu) sengaja dipakai di sini supaya
       deployment white-label baru tidak menampilkan identitas satu
       barbershop tertentu sebelum tenant-nya sendiri diketahui. -->
  <meta name="theme-color" content="#F5F7FA" />
  <meta name="description" content="Platform manajemen barbershop -- komisi, uang harian, bonus barber, produk, dan pengeluaran." />
  <link rel="manifest" href="manifest.json" />

  <!-- TAHAP 13: set ikon lengkap (sebelumnya manifest.json/tag di bawah ini
       menunjuk ke file icons/* yang belum pernah ada di repo -- PWA jadi
       tidak bisa di-install dengan benar di banyak browser/OS). -->
  <link rel="icon" type="image/x-icon" href="../icons/favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../icons/icon-512.png" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />

  <!-- Splash screen iOS: Safari modern (15+) otomatis membuat launch screen
       dari ikon + background_color manifest begitu tag "web-app-capable" di
       bawah ini ada, tanpa perlu puluhan gambar apple-touch-startup-image
       per resolusi device. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Rivoir" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- PERBAIKAN MEKANISME CACHE & UPDATE PWA (v57): query "?v=200" di
       SETIAP <link rel="stylesheet">/<script src> di bawah ini adalah
       cache-busting di lapisan URL, INDEPENDEN dari Service Worker --
       browser/CDN mana pun yang meng-cache berdasar URL persis tidak
       punya alasan menyajikan byte lama begitu query string-nya beda.
       WAJIB dinaikkan BERSAMAAN dengan ASSET_VERSION di service-worker.js
       ke angka yang SAMA setiap deploy yang mengubah isi file JS/CSS
       manapun yang dirujuk di sini (lihat komentar ASSET_VERSION di
       service-worker.js untuk alasan kenapa dua tempat ini tidak bisa
       disatukan lewat satu file "sumber kebenaran" tanpa proses build). -->
  <link rel="stylesheet" href="css/style.css?v=200" />
</head>
<body>
  <div id="app">
    <div class="boot-loading">
      <div class="boot-loading-spinner"></div>
      <p class="boot-loading-text">Memuat aplikasi...</p>
    </div>
  </div>

  <!-- Ganti nilai ini ke URL backend setelah deploy, contoh:
       <script>window.MUGEN_API_BASE = "https://api.rivoirsett.com";</script>
       Dibiarkan kosong di sini supaya api.js otomatis pakai localhost:8000
       saat development, dan bisa dioverride lewat env saat build/deploy. -->
  <script src="config.js?v=200"></script>
  <!-- REVISI: preconnect sedini mungkin ke backend Render -- logo & banner
       (dan semua data lain) dimuat dari origin ini, jadi DNS/TLS handshake-nya
       bisa mulai lebih awal sebelum brand.js sempat meminta gambar apa pun,
       supaya logo/banner tersedia lebih cepat saat aplikasi pertama dibuka. -->
  <script>
    if (window.MUGEN_API_BASE) {
      const preconnect = document.createElement("link");
      preconnect.rel = "preconnect";
      preconnect.href = window.MUGEN_API_BASE;
      document.head.appendChild(preconnect);
    }
  </script>

  <!-- Preview PDF (Cetak PDF): file bootstrap PDF.js -- KECIL, hanya
       mendefinisikan cara memuatnya, TIDAK LAGI langsung mengunduh
       pdf.min.js (512KB) di sini (lihat PERBAIKAN PERFORMA di
       pdfjs_boot.js -- pengukuran SEBELUMNYA yang mengira fetch besar itu
       "berjalan di background, tidak memblokir" TERNYATA salah, itu
       bottleneck utama /book). Tetap type="module" supaya bisa `import()`
       dinamis file lokal vendor/pdfjs/ -- lihat pdfjs_boot.js untuk kenapa
       dipakai lewat window.pdfjsLib + event 'pdfjs-ready', bukan import
       langsung di pdf_preview.js. -->
  <script type="module" src="js/pdfjs_boot.js?v=200"></script>
  <script src="js/state.js?v=200"></script>
  <!-- REVISI UI/UX: theme.js dimuat SEDINI mungkin (segera setelah
       state.js) dan langsung menerapkan atribut data-theme begitu file
       ini selesai dieksekusi (lihat applyStored() di baris terakhir
       theme.js) -- supaya tema Dark/Light yang benar sudah aktif SEBELUM
       #app sempat digambar sama sekali, menghindari "flash" tema salah. -->
  <script src="js/theme.js?v=200"></script>
  <!-- PERBAIKAN PERFORMA (halaman /book lambat saat pertama kali dibuka):
       sempat dicoba menambah atribut "defer" di ke-35 script di bawah ini
       supaya browser mengunduhnya paralel, bukan satu-satu berurutan.
       Diukur (Playwright + CDP network throttling ~4Mbps/50ms RTT, meniru
       kondisi mobile): TERNYATA browser modern (preload scanner Chrome)
       SUDAH mengunduh script <script src> biasa secara paralel walau tanpa
       "defer" -- percobaan "defer" tidak memberi perbaikan terukur sama
       sekali (varians pengukuran, bukan perbaikan sungguhan), jadi TIDAK
       jadi dipakai di sini (lihat vendor/pdfjs/pdf.min.js di atas untuk
       bottleneck SUNGGUHAN yang ditemukan & diperbaiki). Dicatat di sini
       supaya tidak ada yang mencoba "defer" lagi tanpa mengukur ulang. -->
  <script src="js/api.js?v=200"></script>
  <script src="js/ui.js?v=200"></script>
  <script src="js/pdf_preview.js?v=200"></script>
  <script src="js/brand.js?v=200"></script>
  <script src="js/subscription.js?v=200"></script>
  <script src="js/feature_access.js?v=200"></script>
  <script src="js/menu_access.js?v=200"></script>
  <script src="js/pwa_update.js?v=200"></script>
  <script src="js/nav.js?v=200"></script>
  <script src="js/booking_notif.js?v=200"></script>
  <script src="js/izin_notif.js?v=200"></script>
  <script src="js/push_notif.js?v=200"></script>
  <!-- FITUR Izin Lokasi & Notifikasi Push OTOMATIS khusus APK Android (lihat
       native_app.js) -- HARUS setelah push_notif.js (dipakai di dalamnya),
       SEBELUM login.js (dipanggil dari sana begitu login berhasil). -->
  <script src="js/native_app.js?v=200"></script>
  <script src="js/pages/login.js?v=200"></script>
  <script src="js/pages/register.js?v=200"></script>
  <script src="js/pages/lupa_password.js?v=200"></script>
  <script src="js/pages/reset_password.js?v=200"></script>
  <script src="js/pages/verify_email.js?v=200"></script>
  <script src="js/pages/subscription_blocked.js?v=200"></script>
  <script src="js/pages/tenant_not_found.js?v=200"></script>
  <!-- PERBAIKAN PERFORMA (loading awal lambat): 20 modul js/pages/*.js yang
       DULU ada di sini (dashboard_owner.js, dashboard_barber.js,
       input_data.js, rekap.js, pengeluaran.js, pemasukan.js, uang_kas.js,
       riwayat_transaksi.js, slip_gaji.js, kasbon.js, komisi.js,
       reimburse.js, izin_cuti.js, absensi.js, pengaturan.js, billing.js,
       produk.js, booking.js, book_public.js, superadmin.js -- total ratusan
       KB) SEKARANG dimuat DINAMIS oleh page_loader.js, HANYA saat menunya
       benar-benar dibuka (lihat router.js) -- bukan di awal aplikasi
       dibuka. Halaman kecil/boot-critical di atas (login, register, lupa/
       reset password, verify email, subscription blocked, tenant not
       found) TETAP di sini seperti sebelumnya. -->
  <script src="js/page_loader.js?v=200"></script>
  <script src="js/tenant_guard.js?v=200"></script>
  <script src="js/router.js?v=200"></script>
  <script src="js/app.js?v=200"></script>
</body>
</html>
