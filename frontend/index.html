<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>MUGEN Hair Co.</title>
  <!-- TAHAP 10: judul di atas hanya fallback awal sebelum JS jalan — brand.js
       akan menimpa document.title dengan nama barbershop dari database begitu
       halaman selesai dimuat, jadi tidak lagi hardcode di alur aplikasi. -->
  <meta name="theme-color" content="#121212" />
  <meta name="description" content="Aplikasi manajemen komisi, uang harian, bonus barber, produk, dan pengeluaran — MUGEN Hair Co." />
  <link rel="manifest" href="manifest.json" />

  <!-- TAHAP 13: set ikon lengkap (sebelumnya manifest.json/tag di bawah ini
       menunjuk ke file icons/* yang belum pernah ada di repo -- PWA jadi
       tidak bisa di-install dengan benar di banyak browser/OS). -->
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <!-- Splash screen iOS: Safari modern (15+) otomatis membuat launch screen
       dari ikon + background_color manifest begitu tag "web-app-capable" di
       bawah ini ada, tanpa perlu puluhan gambar apple-touch-startup-image
       per resolusi device. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MUGEN Hair" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <p class="status-placeholder">Memuat aplikasi...</p>
  </div>

  <!-- Ganti nilai ini ke URL backend Render setelah deploy, contoh:
       <script>window.MUGEN_API_BASE = "https://mugen-hair-api.onrender.com";</script>
       Dibiarkan kosong di sini supaya api.js otomatis pakai localhost:8000
       saat development, dan bisa dioverride lewat env saat build/deploy. -->
  <script src="config.js"></script>

  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/dashboard_owner.js"></script>
  <script src="js/pages/dashboard_barber.js"></script>
  <script src="js/pages/input_data.js"></script>
  <script src="js/pages/rekap.js"></script>
  <script src="js/pages/pengeluaran.js"></script>
  <script src="js/pages/pengaturan.js"></script>
  <script src="js/pages/produk.js"></script>
  <script src="js/pages/sinkronisasi.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
